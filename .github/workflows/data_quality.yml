name: Existing data quality maintenance
on:
  push:
    branches: [main]
    paths:
      - 'cloud/quality_audit.py'
      - '.github/workflows/data_quality.yml'
permissions:
  contents: read
concurrency:
  group: existing-data-quality
  cancel-in-progress: false
jobs:
  audit:
    if: contains(github.event.head_commit.message, 'QUALITY_AUDIT_20261024')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: pip install -e . -r requirements-cloud.txt
      - run: python cloud/quality_audit.py
