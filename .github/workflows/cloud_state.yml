name: Read Ulucks cloud state
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud_state.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ulucks-cloud-state-read
  cancel-in-progress: false
jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
      GCP_SCHEDULER_JOB: ${{ vars.GCP_SCHEDULER_JOB }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PAGES_SERVICE_ACCOUNT }}
      - run: python -m pip install --quiet 'google-cloud-storage>=2.19,<4'
      - name: Read only the official release pointer and safe aggregate counts
        run: |
          python - <<'PY'
          import os,json
          from google.cloud import storage
          b=storage.Client().bucket(os.environ['GCP_BUCKET']).blob('state/current.json')
          b.reload();generation=int(b.generation);h=json.loads(b.download_as_bytes(if_generation_match=generation))
          keys=('collection_mode','company_id','area_id','company_count','successful_companies','failed_companies','company_census',
            'parsed_rows','attached_rows','held_rows','anomaly_rows','duplicate_rows','retained_rows','row_counts',
            'pdf_count','new_buildings','matched_existing_rows','legacy_overlap_rows','managed_overlap_rows','cross_company_duplicate_rows',
            'counts_before','counts_after','public_counts','area_counts','acquired_at','processed_at','all_company_proof','reused_acquisition_run',
            'integration_contract','acquisition_manifest_ref','company_ids','company_results')
          result={k:h.get(k) for k in ('schema','qc','run_id','source_commit','master','public')}
          result.update(generation=generation,report={k:h['report'][k] for k in keys if k in h.get('report',{})})
          print('CLOUD_STATE_SAFE_JSON='+json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read Job, Scheduler, executions and allowlisted collection progress
        run: |
          python - <<'PY'
          import os,json,subprocess,re
          from datetime import datetime,timezone,timedelta
          project=os.environ['GCP_PROJECT_ID'];region=os.environ['GCP_REGION'];job=os.environ['GCP_JOB']
          def read(args):
              r=subprocess.run(['gcloud','--project',project,'--quiet',*args],capture_output=True,text=True,timeout=90)
              if r.returncode:
                  print('CLOUD_READ_ERROR='+json.dumps({'command':args[:3],'classes':sorted(set(re.findall(r'PERMISSION_DENIED|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED',r.stderr)))}))
                  return None
              return json.loads(r.stdout)
          j=read(['run','jobs','describe',job,'--region',region,'--format=json(metadata.labels,spec.template.spec.template.spec.timeoutSeconds,spec.template.spec.template.spec.containers.image,spec.template.spec.template.spec.containers.args)'])
          if j:
              spec=j.get('spec',{}).get('template',{}).get('spec',{}).get('template',{}).get('spec',{})
              c=(spec.get('containers') or [{}])[0]
              print('JOB_STATE_SAFE='+json.dumps({'source_commit':j.get('metadata',{}).get('labels',{}).get('source-commit'),'timeout':spec.get('timeoutSeconds'),'args':c.get('args'),'image':c.get('image')}))
          s=read(['scheduler','jobs','describe',os.environ['GCP_SCHEDULER_JOB'],'--location',region,'--format=json(state,schedule,timeZone,httpTarget.uri,lastAttemptTime)'])
          if s:
              target='https://run.googleapis.com/v2/projects/'+project+'/locations/'+region+'/jobs/'+job+':run'
              print('SCHEDULER_STATE_SAFE='+json.dumps({'state':s.get('state'),'schedule':s.get('schedule'),'timeZone':s.get('timeZone'),'expected_target':s.get('httpTarget',{}).get('uri')==target,'lastAttemptTime':s.get('lastAttemptTime')}))
          xs=read(['run','jobs','executions','list','--job',job,'--region',region,'--limit=5','--format=json'])
          if xs is not None:
              print('EXECUTION_STATE_SAFE='+json.dumps({'active':sum(not x.get('status',{}).get('completionTime') for x in xs),
                'latest':[{'name':x.get('metadata',{}).get('name'),'start':x.get('status',{}).get('startTime'),'end':x.get('status',{}).get('completionTime'),
                'succeeded':x.get('status',{}).get('succeededCount',0),'failed':x.get('status',{}).get('failedCount',0)} for x in xs]}))
          since=(datetime.now(timezone.utc)-timedelta(minutes=35)).isoformat()
          q='resource.type="cloud_run_job" AND resource.labels.job_name="'+job+'" AND timestamp>="'+since+'"'
          logs=read(['logging','read',q,'--limit=1000','--order=asc','--format=json'])
          allowed=('stage','run_id','company_id','parsed_rows','pdf_count','pdf_pages','expected_rows','completed_companies','completed','company_count','code')
          if logs:
              for x in logs:
                  line=x.get('textPayload') or (x.get('jsonPayload') or {}).get('message','')
                  if isinstance(line,str) and line.startswith(('ULUCKS_COLLECTION_SAFE=','ULUCKS_BATCH_SAFE=')):
                      r=json.loads(line.split('=',1)[1])
                      print('COLLECTION_PROGRESS_SAFE='+json.dumps({'timestamp':x.get('timestamp'),**{k:r[k] for k in allowed if k in r}},ensure_ascii=False))
                  p=x.get('jsonPayload',{})
                  if p.get('status') in ('committed','failed','skipped'):
                      print('COLLECTION_RESULT_SAFE='+json.dumps({'timestamp':x.get('timestamp'),**{k:p[k] for k in ('status','run_id','code','public_sha256') if k in p}},ensure_ascii=False))
          PY
