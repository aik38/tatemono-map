name: Deploy Ulucks cloud collector

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/cloud_deploy.yml'
  workflow_dispatch:

concurrency:
  group: ulucks-cloud-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . -r requirements.txt -r requirements-dev.txt -r requirements-cloud-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Required tests and full-suite regression comparison
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PUSH_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^1)"
          fi
          python cloud/check_tests.py --base "$base"

  deploy:
    needs: test
    if: vars.CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
      GCP_ADOPT_IMAGE: ${{ vars.GCP_ADOPT_IMAGE }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_SCHEDULER_JOB: ${{ vars.GCP_SCHEDULER_JOB }}
      ULUCKS_CONFIG_SECRET: ${{ vars.ULUCKS_CONFIG_SECRET }}
      ULUCKS_LOGIN_SECRET: ${{ vars.ULUCKS_LOGIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry authentication
        env:
          REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push private collector image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/ulucks:${{ github.sha }}
      - name: Safely adopt existing Job and run complete collection
        env:
          COLLECTOR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/ulucks@${{ steps.image.outputs.digest }}
        run: python cloud/deploy_job.py
