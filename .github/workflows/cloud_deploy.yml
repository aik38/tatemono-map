name: Deploy Ulucks cloud collector
run-name: ${{ inputs.activation_id && format('Ulucks initial {0}', inputs.activation_id) || 'Deploy Ulucks cloud collector' }}

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/cloud/**'
      - 'cloud/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/cloud_deploy.yml'
  workflow_dispatch:
    inputs:
      activation_id:
        description: Non-sensitive first activation correlation ID
        required: false
        type: string

concurrency:
  group: ulucks-cloud-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . -r requirements.txt -r requirements-dev.txt -r requirements-cloud-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Required tests and full-suite regression comparison
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PUSH_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^1)"
          fi
          python cloud/check_tests.py --base "$base"
      - name: Save synthetic test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-test-diagnostics
          path: |
            work/test-comparison/*.log
            work/test-comparison/*.xml
          retention-days: 3

  deploy:
    needs: test
    # A repair merge must not race the resumable operator's explicit dispatch.
    # One controlled recovery on the reviewed PR merge; all other pushes remain test-only.
    if: vars.CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'ULUCKS_FULLAREA_COMPANY8_20261018') || contains(github.event.head_commit.message, 'ULUCKS_UI_ONESHOT_20261017') || contains(github.event.head_commit.message, 'ULUCKS_COMPANY_ROW_ONESHOT_20261017') || contains(github.event.head_commit.message, 'ULUCKS_DOM_OBSERVE_20261017') || contains(github.event.head_commit.message, 'ULUCKS_SEARCH_OBSERVE_20261017') || contains(github.event.head_commit.message, 'ULUCKS_AREA_ONLY_20261017') || contains(github.event.head_commit.message, 'ULUCKS_LIVE_DOM_20261017') || contains(github.event.head_commit.message, 'ULUCKS_SEARCH_DOM_20261017') || contains(github.event.head_commit.message, 'ULUCKS_FORM_SUBMIT_20261017') || contains(github.event.head_commit.message, 'ULUCKS_POST_SEARCH_RESULTS_20261017'))))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
      GCP_ADOPT_IMAGE: ${{ vars.GCP_ADOPT_IMAGE }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_SCHEDULER_JOB: ${{ vars.GCP_SCHEDULER_JOB }}
      ULUCKS_CONFIG_SECRET: ${{ vars.ULUCKS_CONFIG_SECRET }}
      ULUCKS_CONFIG_JSON: ${{ vars.ULUCKS_CONFIG_JSON }}
      ULUCKS_LOGIN_SECRET: ${{ vars.ULUCKS_LOGIN_SECRET }}
      ULUCKS_EXPANSION_STAGE: company8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install private backup client
        run: python -m pip install 'google-cloud-storage>=2.19,<4'
      - name: Configure Artifact Registry authentication
        env:
          REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push private collector image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/ulucks:${{ github.sha }}
      - name: Safely adopt existing Job and run complete collection
        id: collect
        continue-on-error: true
        env:
          COLLECTOR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/ulucks@${{ steps.image.outputs.digest }}
        run: python cloud/deploy_job.py
      - name: Classify the actual Cloud Run failure without exposing private logs
        if: steps.collect.outcome == 'failure'
        run: |
          python cloud/safe_collection_failure.py
          exit 1

  diagnose_previous_job_read_only:
    # Only this merge commit triggers the diagnosis. Existing push deploy remains skipped.
    if: github.repository == 'aik38/tatemono-map' && github.event_name == 'push' && (contains(github.event.head_commit.message, 'ULUCKS_READ_ONLY_DIAG_38914804946') || contains(github.event.head_commit.message, 'ULUCKS_READ_ONLY_FOLLOWUP_38914804946'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
      GCP_OLD_IMAGE: ${{ vars.GCP_ADOPT_IMAGE }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install read-only GCS client
        run: python -m pip install --quiet 'google-cloud-storage>=2.19,<4'
      - name: Inspect pinned private error, Job state and executions without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from google.cloud import storage
          project=os.environ['GCP_PROJECT_ID']
          region=os.environ['GCP_REGION']
          job_name=os.environ['GCP_JOB']
          bucket=storage.Client(project=project).bucket(os.environ['GCP_BUCKET'])
          run='38914804946'
          commit='012119ded35e57aec16dfe178313d605c678e008'
          report={'mode':'one_time_read_only','failed_workflow':run,'gcp_mutations':False}
          def fetch(name,content=False):
              blob=bucket.blob(name)
              try:
                  blob.reload(timeout=30)
                  value={'status':'exists','generation':str(blob.generation),'bytes':int(blob.size)}
                  if content:
                      raw=blob.download_as_bytes(if_generation_match=int(blob.generation),timeout=45)
                      value['sha256']=hashlib.sha256(raw).hexdigest()
                      return value,raw.decode('utf-8','replace')
                  return value,None
              except Exception as exc:
                  return {'status':type(exc).__name__},None
          info,raw=fetch('deployment-backups/diagnostics/'+run+'-1.log',True)
          if raw is not None:
              patterns=[
                  ('PERMISSION_DENIED',r'PERMISSION_DENIED|permission denied|does not have permission|403'),
                  ('INVALID_ARGUMENT',r'INVALID_ARGUMENT|invalid argument|400'),
                  ('FAILED_PRECONDITION',r'FAILED_PRECONDITION|failed precondition|412'),
                  ('NOT_FOUND',r'NOT_FOUND|not found|404'),
                  ('ALREADY_EXISTS',r'ALREADY_EXISTS|409|conflict'),
                  ('UNAUTHENTICATED',r'UNAUTHENTICATED|401'),
                  ('TIMEOUT',r'DEADLINE_EXCEEDED|timed out|timeout'),
                  ('UNAVAILABLE',r'UNAVAILABLE|503'),
                  ('BAD_FLAG',r'unrecognized arguments|unrecognized flag|Unknown command line flag'),
                  ('INVALID_ENV',r'--update-env-vars|Invalid dictionary syntax|env.*invalid|invalid.*env'),
                  ('ACT_AS',r'iam.serviceAccounts.actAs'),
                  ('RUN_UPDATE_PERMISSION',r'run.jobs.update|run.jobs.replace'),
                  ('IMAGE',r'container image|image.*(invalid|not found|permission|denied)'),
                  ('LABEL',r'label.*(invalid|error)|invalid.*label'),
                  ('SERVICE_ACCOUNT',r'service.account.*(permission|denied|not found|invalid)')]
              info['matched_error_classes']=[n for n,p in patterns if re.search(p,raw,re.I)]
              info['error_code_tokens']=sorted(set(re.findall(r'\b(?:INVALID_ARGUMENT|PERMISSION_DENIED|FAILED_PRECONDITION|NOT_FOUND|ALREADY_EXISTS|UNAUTHENTICATED|RESOURCE_EXHAUSTED|DEADLINE_EXCEEDED|INTERNAL|UNAVAILABLE)\b',raw)))
              info['known_field_tokens']=[t for t in ('spec.template','containers[0]','env[','--update-env-vars','--update-labels','--service-account','--image','--task-timeout','--memory','--cpu','--args','iam.serviceAccounts.actAs','run.jobs.update','run.jobs.replace') if t.lower() in raw.lower()]
              info['line_count']=len(raw.splitlines())
          report['private_update_error']=info
          report['prior_backup'],_=fetch('deployment-backups/'+commit+'-'+run+'-1.yaml')
          report['execution_intent'],_=fetch('deployment-backups/execution-intents/'+run+'.json')
          def gcloud(*args):
              result=subprocess.run(['gcloud',*args,'--project',project,'--quiet'],capture_output=True,text=True,timeout=75)
              if result.returncode:
                  return None,{'status':'command_failed','exit_code':result.returncode,
                    'error_classes':[n for n,p in (('PERMISSION_DENIED',r'PERMISSION_DENIED|permission denied|403'),('NOT_FOUND',r'NOT_FOUND|not found|404'),('INVALID_ARGUMENT',r'INVALID_ARGUMENT|invalid argument|400')) if re.search(p,result.stderr,re.I)]}
              try:return json.loads(result.stdout),{'status':'ok'}
              except ValueError:return None,{'status':'non_json_result'}
          job,state=gcloud('run','jobs','describe',job_name,'--region',region,'--format=json')
          if job:
              md=job.get('metadata') or {}
              spec=((job.get('spec') or {}).get('template') or {}).get('spec') or {}
              spec=(spec.get('template') or {}).get('spec') or {}
              image=(spec.get('containers') or [{}])[0].get('image','')
              labels=md.get('labels') or {}
              state.update({'generation':str(md.get('generation','')),
                  'image_state':'approved_old_image' if image==os.environ['GCP_OLD_IMAGE'] else ('new_failed_run_image' if commit in image else 'other_image'),
                  'image_digest_prefix':image.split('@sha256:')[-1][:12] if '@sha256:' in image else None,
                  'managed_by':labels.get('managed-by','unset'),
                  'source_commit':labels.get('source-commit','unset'),
                  'runtime_service_account_matches':spec.get('serviceAccountName')=='tm-ulucks-runtime@tatemono-map.iam.gserviceaccount.com'})
          report['current_cloud_run_job']=state
          executions,execution_state=gcloud('run','jobs','executions','list','--job',job_name,'--region',region,'--format=json')
          if isinstance(executions,list):
              execution_state.update({'total_returned':len(executions),
                'created_since_failed_workflow':sum(str(x.get('metadata',{}).get('creationTimestamp',''))>='2026-10-16T14:19:17Z' for x in executions),
                'active_count':sum(not (x.get('status') or {}).get('completionTime') for x in executions)})
          report['cloud_run_executions']=execution_state
          # Raw private stderr, full Job JSON and environment values are NEVER printed.
          print('SAFE_READ_ONLY_DIAGNOSIS_JSON='+json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Correlate private error shape with existing Cloud Run execution inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from google.cloud import storage
          project=os.environ['GCP_PROJECT_ID'];region=os.environ['GCP_REGION'];job=os.environ['GCP_JOB']
          bucket=storage.Client(project=project).bucket(os.environ['GCP_BUCKET'])
          def get(name):
              obj=bucket.blob(name);obj.reload(timeout=30)
              raw=obj.download_as_bytes(if_generation_match=int(obj.generation),timeout=45)
              return raw
          raw=get('deployment-backups/diagnostics/38914804946-1.log').decode('utf-8','replace')
          intent=json.loads(get('deployment-backups/execution-intents/38914804946.json'))
          # A deliberately restrictive vocabulary; neither private messages nor identifiers
          # are copied verbatim into public Actions logs.
          permitted=set(('error warning failed failure update updated updating job jobs operation '
              'completed complete ready not invalid permission denied argument arguments '
              'unrecognized flag flags could cannot access service account specified '
              'container image env variable variables parsing format yaml value expected '
              'requires required request response deadline exceeded timeout timed out '
              'polling cancel cancelled aborted retry retries retrying creating replacing '
              'reconciliation reconcile operation rejected conflict progress resource '
              'already exists unable unavailable active execution executions succeeded '
              'start starting started finishing finished waiting status code found '
              'annotation annotations labels configuration spec task tasks memory cpu '
              'google cloud run gcloud running was is in to at of and by the '
              'internal api call unexpected none permission_denied invalid_argument '
              'failed_precondition not_found unauthenticated').split())
          shapes=[]
          for line in raw.splitlines():
              words=[w.lower() for w in re.findall(r'[A-Za-z][A-Za-z_-]{1,40}',line)]
              allowed=[w for w in words if w in permitted]
              shapes.append({'recognized_words':allowed[:25],'word_count':len(words),'has_ERROR_prefix':bool(re.search(r'\bERROR[: ]',line,re.I))})
          result={'stderr_sha256':hashlib.sha256(raw.encode()).hexdigest(),'stderr_line_shapes':shapes,
                  'prior_execution_count':len(intent.get('previous_executions',[]))}
          def gc(*args):
              r=subprocess.run(['gcloud',*args,'--project',project,'--quiet'],text=True,capture_output=True,timeout=75)
              if r.returncode:return None,{'ok':False,'code':r.returncode}
              try:return json.loads(r.stdout),{'ok':True}
              except ValueError:return None,{'ok':False,'reason':'invalid_json'}
          all_runs,rs=gc('run','jobs','executions','list','--job',job,'--region',region,'--format=json')
          if isinstance(all_runs,list):
              past=set(intent.get('previous_executions',[]))
              new=[]
              for item in all_runs:
                  name=str((item.get('metadata') or {}).get('name',''))
                  if name in past:continue
                  status=item.get('status') or {}
                  conditions=[{'type':c.get('type'),'status':c.get('status'),
                    'reason':c.get('reason') if re.fullmatch(r'[A-Za-z0-9_-]{1,64}',str(c.get('reason',''))) else 'redacted'}
                    for c in status.get('conditions',[]) if c.get('type') in ('Completed','Started','ResourcesAvailable','Ready')]
                  new.append({'name_sha256_prefix':hashlib.sha256(name.encode()).hexdigest()[:12],
                    'created':(item.get('metadata') or {}).get('creationTimestamp'),
                    'completed':bool(status.get('completionTime')),
                    'succeeded_count':status.get('succeededCount'),
                    'failed_count':status.get('failedCount'),
                    'cancelled_count':status.get('cancelledCount'),
                    'conditions':conditions})
              result['executions_not_in_pre_update_intent']=new
              result['current_execution_count']=len(all_runs)
          else:result['execution_query']=rs
          info,st=gc('run','jobs','describe',job,'--region',region,'--format=json')
          if info:
              status=info.get('status') or {}
              result['job_status']={'generation':str((info.get('metadata') or {}).get('generation')),
                'observed_generation':str(status.get('observedGeneration','')),
                'conditions':[{'type':c.get('type'),'status':c.get('status'),
                  'reason':c.get('reason') if re.fullmatch(r'[A-Za-z0-9_-]{1,64}',str(c.get('reason',''))) else 'redacted'}
                  for c in status.get('conditions',[]) if c.get('type') in ('Ready','Completed','ResourcesAvailable')]}
          else:result['job_query']=st
          print('SAFE_FOLLOWUP_DIAGNOSIS_JSON='+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY

  diagnose_failed_collection_read_only:
    # The authorized workflow is used only for this explicit, one-shot main merge.
    # Never dispatches, updates, rolls back or executes the Cloud Run Job.
    if: github.repository == 'aik38/tatemono-map' && github.event_name == 'push' && contains(github.event.head_commit.message, 'ULUCKS_EXECUTION_LOG_DIAG_38914804946')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read the one failed Cloud Run execution's logs safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess
          project=os.environ['GCP_PROJECT_ID'];region=os.environ['GCP_REGION'];job=os.environ['GCP_JOB']
          report={'mode':'read_only','target':'failed_execution_after_38914804946','gcp_mutations':False}
          def command(args):
              res=subprocess.run(['gcloud',*args,'--project',project,'--quiet'],text=True,capture_output=True,timeout=80)
              if res.returncode:
                  errors=[name for name,pattern in (
                      ('PERMISSION_DENIED',r'PERMISSION_DENIED|permission denied|403'),
                      ('NOT_FOUND',r'NOT_FOUND|not found|404'),
                      ('UNAUTHENTICATED',r'UNAUTHENTICATED|401'),
                      ('INVALID_ARGUMENT',r'INVALID_ARGUMENT|invalid argument|400'),
                      ('DEADLINE_EXCEEDED',r'DEADLINE_EXCEEDED|timeout|timed out'))
                      if re.search(pattern,res.stderr,re.I)]
                  return None,{'success':False,'exit_code':res.returncode,'error_classes':errors}
              try:return json.loads(res.stdout),{'success':True}
              except ValueError:return None,{'success':False,'error_classes':['INVALID_JSON']}
          rows,st=command(['run','jobs','executions','list','--job',job,'--region',region,'--format=json'])
          if not isinstance(rows,list):
              report['execution_lookup']=st
          else:
              eligible=[e for e in rows if (e.get('metadata') or {}).get('creationTimestamp','') >= '2026-10-16T14:24:20Z'
                  and (e.get('metadata') or {}).get('creationTimestamp','') < '2026-10-16T14:26:10Z']
              report['matching_execution_count']=len(eligible)
              if len(eligible)==1:
                  target=eligible[0];name=(target.get('metadata') or {}).get('name','')
                  status=target.get('status') or {}
                  report['execution']={'created':(target.get('metadata') or {}).get('creationTimestamp'),
                      'completed':bool(status.get('completionTime')),
                      'failed_count':status.get('failedCount'),
                      'succeeded_count':status.get('succeededCount'),
                      'conditions':[{'type':c.get('type'),'status':c.get('status'),
                          'reason':c.get('reason') if re.fullmatch(r'[A-Za-z0-9_-]{1,64}',str(c.get('reason',''))) else 'redacted'}
                          for c in status.get('conditions',[]) if c.get('type') in ('Completed','Started')]}
                  query=('resource.type="cloud_run_job" AND resource.labels.job_name="'+job+
                      '" AND timestamp>="2026-10-16T14:24:20Z" AND timestamp<="2026-10-16T14:26:10Z"')
                  entries,log_state=command(['logging','read',query,'--limit=300','--format=json'])
                  report['logging_query']=log_state
                  if isinstance(entries,list):
                      allowed={
                         'cloud_operation_failed','ulucks_browser_failed','ulucks_credentials_incomplete',
                         'ulucks_login_page_unavailable','ulucks_ui_contract_changed',
                         'ulucks_area_control_changed','ulucks_area_filter_not_exclusive',
                         'ulucks_search_http_failed','ulucks_result_count_not_confirmed',
                         'ulucks_print_link_not_verified','ulucks_export_too_large',
                         'ulucks_export_size_invalid','ulucks_print_action_failed',
                         'ulucks_original_pdf_not_received','ulucks_zero_result_not_stable',
                         'ulucks_pdf_invalid','ulucks_download_is_not_pdf',
                         'ulucks_pdf_invalid_or_no_extractable_text',
                         'master_integrity_failed','ulucks_parser_qc_failed',
                         'legacy_unit_identity_ambiguous','pdf_rows_do_not_match_result_count',
                         'ingest_unmatched_or_suspect_rows','previous_head_changed',
                         'collection_failed','collection_committed'}
                      exception_classes=('PermissionDenied','NotFound','Forbidden','Unauthenticated',
                          'DefaultCredentialsError','RefreshError','KeyError','TypeError',
                          'ValueError','AttributeError','TimeoutError','FileNotFoundError',
                          'OperationalError','IntegrityError','RuntimeError','CollectionError',
                          'GoogleAPICallError','ServiceUnavailable','ResourceExhausted',
                          'BrowserTypeLaunchError','TargetClosedError')
                      observed=[];other_severities={}
                      for e in entries:
                          labels=e.get('labels') or {};resource=(e.get('resource') or {}).get('labels') or {}
                          execution=resource.get('execution_name') or labels.get('run.googleapis.com/execution_name') or ''
                          if execution and execution != name:continue
                          severity=str(e.get('severity','DEFAULT'))
                          other_severities[severity]=other_severities.get(severity,0)+1
                          payload=e.get('jsonPayload') if isinstance(e.get('jsonPayload'),dict) else {}
                          snippets=[str(payload.get('code','')),str(payload.get('status','')),
                              str(payload.get('message','')),str(e.get('textPayload',''))]
                          message=' '.join(snippets)
                          codes=sorted({m for m in re.findall(r'\b[a-z][a-z0-9_]{4,75}\b',message) if m in allowed})
                          classes=[x for x in exception_classes if re.search(r'\b'+re.escape(x)+r'\b',message)]
                          sdk_status=sorted(set(re.findall(r'\b(?:PERMISSION_DENIED|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED|FAILED_PRECONDITION|RESOURCE_EXHAUSTED|DEADLINE_EXCEEDED|UNAVAILABLE)\b',message)))
                          if codes or classes or sdk_status or severity in ('ERROR','CRITICAL','ALERT','EMERGENCY'):
                              observed.append({'timestamp':e.get('timestamp'),'severity':severity,
                                  'codes':codes,'exception_classes':classes,'gcp_statuses':sdk_status,
                                  'payload_type':'structured' if payload else 'text'})
                      report['execution_logs']={'total_queried':len(entries),'severity_counts':other_severities,
                          'relevant_entries':observed[:40]}
          # No raw logs, identifiers, credential values, URLs, or user data are printed.
          print('SAFE_FAILED_EXECUTION_DIAGNOSIS='+json.dumps(report,sort_keys=True,ensure_ascii=False))
          PY

  observe_full_area_once:
    if: github.repository == 'aik38/tatemono-map' && github.event_name == 'push' && contains(github.event.head_commit.message, 'ULUCKS_FULLAREA_OBSERVE_20261018')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_JOB: ${{ vars.GCP_JOB }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Observe live companies and geography through unchanged runtime
        run: python cloud/observe_full_area.py
